name: Build and Release (Windows + Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================
  # 1. Сборка Windows-версии (.exe)
  # ============================================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[build]"

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm pyinstaller-build_1.spec

      - name: List dist folder (debug)
        run: dir dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/ScienceIndexer.exe
          if-no-files-found: error

  # ============================================================
  # 2. Сборка Linux-версии (для Astra Linux Orel 2.12)
  # ============================================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (tkinter + X11)
        run: |
          apt-get update
          apt-get install -y \
            python3-tk \
            tk \
            libx11-6 \
            libxrender1 \
            libxext6 \
            libxfixes3 \
            libxcursor1 \
            libxi6 \
            libxcomposite1 \
            libxrandr2 \
            libxxf86vm1 \
            libxinerama1 \
            software-properties-common \
            curl

      - name: Install Python 3.12 from source
        run: |
          # Скачиваем и компилируем Python 3.12 (так как в Ubuntu 20.04 его нет в пакетах)
          apt-get install -y \
            build-essential \
            zlib1g-dev \
            libncurses5-dev \
            libgdbm-dev \
            libnss3-dev \
            libssl-dev \
            libreadline-dev \
            libffi-dev \
            libsqlite3-dev \
            libbz2-dev \
            liblzma-dev
          
          cd /tmp
          curl -O https://www.python.org/ftp/python/3.12.0/Python-3.12.0.tgz
          tar -xzf Python-3.12.0.tgz
          cd Python-3.12.0
          ./configure --enable-optimizations --with-tcltk-includes='-I/usr/include/tcl8.6' --with-tcltk-libs='-L/usr/lib/x86_64-linux-gnu -ltcl8.6 -ltk8.6'
          make -j$(nproc)
          make altinstall
          
          # Создаем симлинки для удобства
          ln -s /usr/local/bin/python3.12 /usr/local/bin/python
          ln -s /usr/local/bin/pip3.12 /usr/local/bin/pip

      - name: Verify Python installation
        run: |
          python --version
          python -c "import tkinter; print('tkinter OK:', tkinter.TkVersion)"

      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[build]"

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm pyinstaller-build_1.spec

      - name: List dist folder (debug)
        run: ls -la dist/

      - name: Pack Linux binary into tar.gz
        run: |
          cd dist
          tar -czf ../ScienceIndexer-linux.tar.gz ScienceIndexer

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: ScienceIndexer-linux.tar.gz
          if-no-files-found: error

  # ============================================================
  # 3. Создание релиза и загрузка обоих бинарников
  # ============================================================
  create-release:
    name: Create Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-assets/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release-assets/

      - name: List release assets
        run: ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/ScienceIndexer.exe
            release-assets/ScienceIndexer-linux.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}