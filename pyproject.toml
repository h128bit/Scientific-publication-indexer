[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "science_parser"
version = "0.1.0"
dependencies = [
    "jmespath",
    "requests",
    "yarl",
    "tenacity",
    "filetype",
    "streamlit==1.62.0",
    "pywebview==6.2.1",
    "tkinter",
    "certifi",
    "truststore",
    "pip-system-certs"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
build = [
    "pyinstaller",
    "cffi"
]